<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flappy Kiro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-wrapper">
    <canvas id="gameCanvas" width="480" height="640"></canvas>

    <div id="ui-overlay">

      <!-- ── Start / Main Menu ── -->
      <div id="start-screen" class="screen">
        <h1 class="title">FLAPPY<br/><span>KIRO</span></h1>
        <p class="subtitle">guide the ghost through the pipes</p>
        <div class="best-banner">
          <span class="label">BEST</span>
          <span id="menu-best" class="value">0</span>
        </div>
        <p class="prompt blink">PRESS SPACE OR TAP TO START</p>
      </div>

      <!-- ── Pause overlay ── -->
      <div id="pause-screen" class="screen hidden">
        <h2 class="pause-title">PAUSED</h2>
        <p class="pause-hint">PRESS P OR ESC TO RESUME</p>
      </div>

      <!-- ── Game Over ── -->
      <div id="game-over-screen" class="screen hidden">
        <h2 class="gameover-title">GAME<br/>OVER</h2>
        <div class="score-row">
          <div class="score-block">
            <p class="score-label">SCORE</p>
            <p id="final-score" class="score-value accent">0</p>
          </div>
          <div class="score-block">
            <p class="score-label">BEST</p>
            <p id="best-score" class="score-value green">0</p>
          </div>
        </div>
        <p class="prompt blink">PRESS SPACE OR TAP TO RETRY</p>
      </div>

    </div><!-- /ui-overlay -->
  </div><!-- /game-wrapper -->

  <!-- config must load before game logic -->
  <script src="config.js"></script>
  <script src="game.js"></script>
</body>
</html>
